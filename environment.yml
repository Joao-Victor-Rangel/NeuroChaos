# Ambiente usado no desenvolvimento (WSL2 Ubuntu, conda env "neuron-env").
# NEURON não tem wheel oficial para Windows nativo via pip: use WSL2/Linux.
name: neurochaos
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - pip:
      - neuron==8.2.2
      - netpyne==1.0.3.1
      - numpy==1.24.2
      - scipy==1.10.1
      - pandas==1.5.3
      - matplotlib==3.5.1
      - pyyaml==6.0